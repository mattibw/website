<style>
:root{
  --accent:#0f6a67; --accent-hover:#0a524f; --accent-soft:rgba(15,106,103,.06); --accent-under:rgba(15,106,103,.4);
  --bg:#fcfcfd; --card:#ffffff; --body:#1b1e26;
  --border:#e4e4e8; --muted:#6b6f76; --muted2:#4a4d55; --abstract:#33363e;
  --fig-ink:#3d4350; --fig-mut:#9aa0a8; --spark:var(--accent); --ip-soft:var(--accent-soft);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --w:64rem;
}

/* neutralise Quarto chrome, keep footer */
.navbar, #quarto-header, #title-block-header, .quarto-title-banner { display:none !important; }
#quarto-content > main.content, main.content, #quarto-document-content {
  max-width:none; padding-left:0; padding-right:0; padding-top:0; margin:0;
}
#quarto-content { padding-top:0; }

body{ background:var(--bg); color:var(--body); font-family:var(--sans);
  font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased; }

/* sticky slim top nav */
.topnav{position:sticky; top:0; z-index:20; background:rgba(252,252,253,.9);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--border); margin-bottom:0;}
.topnav .inner{max-width:var(--w); margin:0 auto; padding:.7rem 24px;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;}
.topnav .brand{font-family:var(--serif); font-weight:600; font-size:1.05rem; letter-spacing:-.01em;}
.topnav nav{display:flex; gap:1.4rem; flex-wrap:wrap;}
.topnav nav a{font-family:var(--mono); font-size:.8rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); text-decoration:none; border-bottom:none;}
.topnav nav a:hover, .topnav nav a.on{color:var(--accent);}

/* hero / intro */
.hero{max-width:var(--w); margin:0 auto; padding:2.9rem 24px 2.2rem; display:flex; gap:2.6rem; align-items:center;}
.hero-text{flex:1; min-width:0;}
.hero .name{font-family:var(--serif); font-weight:600; font-size:2.5rem; line-height:1.08; letter-spacing:-.015em; margin:0 0 .5rem;}
.hero .tagline{font-size:1.14rem; line-height:1.5; color:var(--abstract); margin:0 0 1.05rem; max-width:36rem;}
.hero .bullets{list-style:none; margin:0 0 1.15rem; padding:0; display:flex; flex-direction:column; gap:.42rem;}
.hero .bullets li{position:relative; padding-left:1.05rem; font-size:.99rem; line-height:1.45;}
.hero .bullets li::before{content:""; position:absolute; left:0; top:.62em; width:5px; height:5px; border-radius:50%; background:var(--accent);}
.hero .links{display:flex; flex-wrap:wrap; align-items:center; gap:.5rem;}
.hero .links a{font-family:var(--mono); font-size:.7rem; font-weight:600; letter-spacing:.06em;
  color:var(--muted2); text-decoration:none; border-bottom:none;
  display:inline-flex; align-items:center; height:1.75rem; padding:0 .7rem;
  border:1px solid #cfd0d6; border-radius:5px;}
.hero .links a:hover{color:var(--accent); border-color:var(--accent);}
.hero .photo{flex:0 0 auto; width:250px; height:auto; border-radius:10px; border:1px solid var(--border); display:block;}
@media (max-width:640px){ .hero{flex-direction:column-reverse; align-items:flex-start; gap:1.4rem;} .hero .photo{width:150px;} .hero .name{font-size:2.1rem;} }

/* content wrapper */
.site{max-width:var(--w); margin:0 auto; padding:0 24px 4rem;}
.site section{margin-bottom:3rem;}
.site h2{font-family:var(--serif); font-weight:600; font-size:1.5rem; letter-spacing:-.01em;
  padding-bottom:.5rem; margin:0 0 1.2rem; border-bottom:1px solid var(--border); text-wrap:balance;}
.site h3{font-family:var(--serif); font-weight:600; font-size:1.24rem; letter-spacing:-.01em; margin:0 0 .2rem;}
.site a{color:var(--accent); text-decoration:underline; text-decoration-color:var(--accent-under); text-underline-offset:3px; text-decoration-thickness:1px; border-bottom:none;}
.site p{margin:.2rem 0 .8rem;}
.paper-card a{ text-decoration:none; }
.paper-card .paper-meta a{ text-decoration:underline; text-decoration-color:var(--accent-under); text-underline-offset:2px; }

.news ul{list-style:none; margin:0; padding:0;}
.news li{display:grid; grid-template-columns:6rem 1fr; gap:.9rem; margin-bottom:.6rem; align-items:baseline;}
.news .date{font-family:var(--mono); font-size:.74rem; color:var(--accent); letter-spacing:.02em;}

/* research cards */
.paper-card{border:1px solid var(--border); border-radius:12px; background:var(--card);
  display:grid; grid-template-columns:1fr 420px; margin:0 0 1.7rem;
  box-shadow:0 1px 2px rgba(20,26,40,.04), 0 14px 34px rgba(20,26,40,.055);}
@media (max-width:720px){ .paper-card{grid-template-columns:1fr;} }
.pc-left{padding:24px 26px 0; display:flex; flex-direction:column; border-radius:12px 0 0 12px;}
.pc-link{margin-bottom:20px;}
.pc-title{font-family:var(--serif); font-weight:600; font-size:1.24rem; line-height:1.2; letter-spacing:-.01em; margin:0 0 .35rem; text-wrap:balance;}
.paper-meta{font-family:var(--mono); font-size:.78rem; color:var(--muted); letter-spacing:.02em; display:block; margin:0 0 .75rem;}
.pc-teaser{font-size:.95rem; line-height:1.62; color:var(--abstract); margin:0 0 12px;}
.pc-teaser b{color:var(--body); font-weight:600;}
.abstract-toggle{background:none; border:0; padding:0; margin:0; cursor:pointer;
  font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.03em; color:var(--accent);
  display:inline-flex; align-items:center; gap:5px; vertical-align:baseline;}
.abstract-toggle:hover{text-decoration:underline;}
.abstract-toggle .chev{font-size:9px; transition:transform .3s ease;}
.abstract-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);}
.abstract-full{max-height:0; overflow:hidden; transition:max-height .45s ease;}
.abstract-full.open{max-height:820px;}
.abstract-full p{margin:6px 0 12px; padding-top:13px; border-top:1px solid var(--border); font-size:.85rem; line-height:1.58; color:var(--muted);}
.pc-link{align-self:flex-start; margin-top:auto; text-decoration:none; font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.03em;
  color:var(--accent); border:1px solid #cfd0d6; border-radius:5px; padding:7px 13px;}
.pc-link:hover{border-color:var(--accent);}
.pc-right{padding:18px 19px 17px; background:#fbfbfc; border-left:1px solid var(--border); display:flex; flex-direction:column; gap:12px; border-radius:0 12px 12px 0;}
@media (max-width:720px){ .pc-left{border-radius:12px 12px 0 0;} .pc-right{border-left:none; border-top:1px solid var(--border); border-radius:0 0 12px 12px;} }
.fig-head{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:26px;}
.toggle{display:inline-flex; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:3px;}
.toggle button{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.02em; border:0; background:transparent; color:var(--muted); padding:6px 11px; border-radius:5px; cursor:pointer;}
.toggle button.on{background:var(--card); color:var(--body); box-shadow:0 1px 2px rgba(20,20,30,.08);}
.replay{font-family:var(--mono); font-size:11px; color:var(--muted); border:1px solid var(--border); background:var(--card); border-radius:6px; padding:6px 10px; cursor:pointer;}
.replay:hover{color:var(--body); border-color:var(--muted);}
.stage{background:var(--card); border:1px solid var(--border); border-radius:9px; padding:8px;}
.stage svg{display:block; width:100%; height:auto;}
.view{display:none;} .view.active{display:block;}
.legend{display:flex; gap:14px; font-family:var(--mono); font-size:10.5px; color:var(--muted); flex-wrap:wrap;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.sw{width:11px; height:3px; border-radius:2px; display:inline-block;}
.sw.g{background:var(--spark);} .sw.n{background:var(--fig-ink);} .sw.o{background:var(--fig-mut);}
.fig-cap{font-family:var(--mono); font-size:10px; line-height:1.45; color:var(--muted);}
.coefs{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
.coef{background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 9px;}
.coef .v{font-family:var(--serif); font-size:1.32rem; font-weight:600; color:var(--body); font-variant-numeric:tabular-nums; line-height:1;}
.coef .v sup{font-size:.55em; color:var(--muted);}
.coef .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-top:4px;}

/* relocation figure */
.mne-fill-ip{fill:var(--ip-soft);} .mne-fill-non{fill:rgba(61,67,80,.05);}
.mne-border{fill:none; stroke:#d3d6dc; stroke-width:1.3;}
.mne-split{stroke:#c2c6cd; stroke-width:1.3; stroke-dasharray:4 4;}
.mne-tab{font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; fill:var(--muted);}
.c-name{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; font-weight:600; fill:var(--body);}
.rcoef{font-family:var(--serif); font-weight:600; font-size:27px; font-variant-numeric:tabular-nums;}
.rcoef .pct{font-size:15px;}
.rcoef.up{fill:var(--spark);} .rcoef.dn{fill:var(--fig-ink);}
.caret{opacity:1; transition:opacity .4s ease;}
.caret.up{fill:var(--spark);} .caret.dn{fill:var(--fig-ink);}

/* event study + concept sparklines */
.es-line{fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.es-line.blue{stroke:var(--fig-ink); opacity:.9;}
.es-grid{stroke:var(--fig-mut); stroke-width:1; stroke-dasharray:1 4; opacity:.5;}
.es-zero{stroke:var(--fig-mut); stroke-width:1; opacity:.7;}
.es-reform{stroke:var(--fig-mut); stroke-width:1; stroke-dasharray:2 3; opacity:.7;}
.es-lab{fill:var(--muted); font-family:var(--mono); font-size:9px;}
.es-ci-bar{stroke:var(--fig-ink); stroke-width:1.6; opacity:.32;}
.es-dot{fill:var(--fig-ink); stroke:var(--card); stroke-width:1.4;}
.es-dot.ref{fill:var(--card); stroke:var(--fig-mut);} .es-dot.end{fill:var(--spark);}
#es-path, #es-path-sun{fill:none; stroke:var(--fig-ink); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:0;}

.cap-lab{font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; fill:var(--muted);}
.cn-box{fill:none; stroke:#d3d6dc; stroke-width:1.2;}
.cn-name{font-family:var(--mono); font-size:8.5px; letter-spacing:.05em; font-weight:600; fill:var(--body);}
.cn-link{stroke:var(--fig-mut); stroke-width:1; stroke-dasharray:2 3; opacity:.6;}
.trend-lab{font-family:var(--mono); font-size:9px; letter-spacing:.05em; font-weight:600;}
.trend-lab.up{fill:var(--spark);} .trend-lab.dn{fill:var(--fig-ink);}
.spark-solid{fill:none; stroke:var(--spark); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:0;}
.spark-dashed{fill:none; stroke:var(--fig-ink); stroke-width:1.8; stroke-dasharray:5 3; stroke-linecap:round; opacity:1;}
.gl{color:var(--fig-ink);}
.gl.off{color:var(--fig-mut);}
.gl.host{color:var(--fig-ink); transition:color .5s ease;}
.gl.host.net{color:var(--accent);}
.ex-arrow{stroke:var(--accent); stroke-width:1.4; opacity:.45;}
.no-arrow{stroke:#c9ccd2; stroke-width:1.3; stroke-dasharray:3 3; opacity:.8;}
.host-lab{font-family:var(--mono); font-size:8.5px; letter-spacing:.03em; fill:var(--body);}
.host-lab.net{fill:var(--accent);}
.host-x{font-family:var(--mono); font-size:7px; letter-spacing:.04em; fill:var(--muted);}
.doc-g{opacity:0; transition:transform .85s ease, opacity .3s ease;}

@media (prefers-reduced-motion:reduce){
  .es-line,.caret,.abstract-full,.abstract-toggle .chev,.spark-solid,.spark-dashed,.doc-g,.gl.host,#es-path,#es-path-sun{transition:none !important;}
}

/* publications (kept) */
#publications p { padding-left: 1.4rem; text-indent: -1.4rem; font-size: .95rem; }
#publications .pub-group { margin: 1.9rem 0 .5rem; }

/* teaching (kept) */
.teach-level { font-family: var(--mono); font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); margin: 1.5rem 0 .5rem; }
.teach { display: grid; row-gap: .45rem; margin: 0; }
.course { display: grid; grid-template-columns: 1fr auto; column-gap: 1.5rem; align-items: baseline; }
.course-name { font-size: .95rem; line-height: 1.45; }
.course-meta { font-family: var(--mono); font-size: .74rem; color: var(--muted); letter-spacing: .02em; white-space: nowrap; }
.teach-stats { display: flex; flex-wrap: wrap; gap: 1rem 2.75rem; margin-top: 1.75rem; padding-top: 1.15rem; border-top: 1px solid var(--border); }
.stat .stat-n { display: block; font-family: var(--serif); font-weight: 600; font-size: 1.45rem; line-height: 1; color: var(--accent); }
.stat .stat-l { display: block; font-family: var(--mono); font-size: .68rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-top: .35rem; max-width: 12rem; line-height: 1.4; }

@media (max-width: 480px) { .course { grid-template-columns: 1fr; } .course-meta { white-space: normal; margin-top: .05rem; } }

</style>
